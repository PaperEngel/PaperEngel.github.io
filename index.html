<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Welcome to PaperEngel's website">
  <title>PaperEngel</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #0b1020;
      --surface: rgba(255, 255, 255, 0.08);
      --text: #f7f8ff;
      --muted: #bdc3d7;
      --accent: #8ea7ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(106, 90, 205, 0.35), transparent 30rem),
        radial-gradient(circle at 80% 75%, rgba(70, 130, 180, 0.25), transparent 28rem),
        var(--background);
    }

    main {
      width: min(680px, calc(100% - 2rem));
      padding: clamp(2rem, 7vw, 4.5rem);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2.5rem, 10vw, 5rem);
      line-height: 1;
      letter-spacing: -0.055em;
    }

    p {
      max-width: 36rem;
      margin: 0 auto 2rem;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 1.7;
    }

    a {
      display: inline-block;
      padding: 0.8rem 1.15rem;
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(142, 167, 255, 0.16);
      transition: transform 160ms ease, background 160ms ease;
    }

    a:hover {
      transform: translateY(-2px);
      background: rgba(142, 167, 255, 0.28);
    }

    a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main>
    <h1>PaperEngel</h1>
    <p>Welcome to my website. This starter homepage is ready for projects, ideas, and anything I want to share.</p>
    <a href="https://github.com/PaperEngel">View on GitHub</a>
  </main>
</body>
</html>
